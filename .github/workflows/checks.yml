name: Repository checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shell syntax
        run: bash -n install.sh docs/06-test/install-check.sh
      - name: Check Python syntax
        run: python -m py_compile setup/server.py
      - name: Run offline installation checks
        run: bash docs/06-test/install-check.sh
